<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pemulihan Admin Titan</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:2rem;background:#ecf4ef;color:#143b2b}main{max-width:32rem;margin:3rem auto;background:white;padding:2rem;border-radius:1rem}input,button{display:block;box-sizing:border-box;width:100%;padding:.8rem;margin:.4rem 0 1rem}button{background:#145a3e;color:white;border:0;border-radius:.3rem;cursor:pointer}p{line-height:1.5}</style></head><body><main><h1>Pulihkan admin</h1><p>Masukkan password <strong>website admin</strong> yang baru, bukan password broker. Gunakan minimal 16 karakter unik. Jangan kirim password melalui chat.</p><form id="form"><label for="pw">Password baru</label><input id="pw" type="password" minlength="16" maxlength="128" autocomplete="new-password" required><label for="pw2">Ulangi password</label><input id="pw2" type="password" minlength="16" maxlength="128" autocomplete="new-password" required><button type="submit">Simpan password baru</button></form><p id="status" role="status"></p></main><script>
'use strict';
const code=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const form=document.getElementById('form'),status=document.getElementById('status');
if(!/^[a-f0-9]{64}$/.test(code)){form.hidden=true;status.textContent='Tautan pemulihan tidak valid.';}
form.addEventListener('submit',async(e)=>{e.preventDefault();const pw=document.getElementById('pw'),pw2=document.getElementById('pw2');if(pw.value!==pw2.value){status.textContent='Password tidak sama.';return;}const button=form.querySelector('button');button.disabled=true;status.textContent='Memproses…';try{const response=await fetch('/api/auth/recover-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,password:pw.value})});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'Permintaan gagal.');pw.value='';pw2.value='';form.hidden=true;status.textContent='Password berhasil diperbarui. Silakan kembali ke halaman utama dan masuk.';}catch(err){status.textContent=err.message||'Koneksi gagal.';button.disabled=false;}});
</script></body></html>
